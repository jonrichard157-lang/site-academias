<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Débora &amp; João Ricardo · 27.05.2027</title>
  <meta name="description" content="Débora e João Ricardo convidam você para celebrar seu casamento — quinta-feira, 27 de maio de 2027, às 10h30, em Indaiatuba." />
  <meta name="theme-color" content="#fefbec" />
  <meta property="og:title" content="Débora & João Ricardo · 27.05.2027" />
  <meta property="og:description" content="Convidamos você para celebrar nosso casamento. Quinta, 27 de maio de 2027, às 10h30." />
  <meta property="og:image" content="img/capa.jpg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Gilda+Display&family=Libre+Baskerville:ital,wght@1,400;1,700&family=Great+Vibes&display=swap" rel="stylesheet" />
  <style>
    :root {
      --papel: #fefbec;
      --tinta: #5b4239;
      --tinta-suave: #6f5a52;
      --linha: #7f9c98;
      --azul: #a9c5e6;
      --azul-forte: #8fb2db;
      --creme-icone: #f6ecd8;
      --serif: "Gilda Display", "Times New Roman", serif;
      --italico: "Libre Baskerville", Georgia, serif;
      --script: "Great Vibes", cursive;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      min-height: 100svh;
      background: #f3f1ea;
      color: var(--tinta);
      font-family: var(--serif);
      display: flex;
      justify-content: center;
    }
    .folha {
      width: 100%;
      max-width: 520px;
      min-height: 100svh;
      background: var(--papel);
      box-shadow: 0 0 40px rgb(0 0 0 / 0.06);
    }
    [hidden] { display: none !important; }
    .nomes:focus { outline: none; }

    /* ---------- Tela 1: capa ---------- */
    .capa {
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f5debc;
    }
    .capa button {
      display: block;
      width: 100%;
      border: 0;
      padding: 0;
      background: none;
      cursor: pointer;
    }
    .capa img {
      display: block;
      width: 100%;
      height: auto;
      transition: transform 0.6s ease;
    }
    .capa button:hover img,
    .capa button:focus-visible img { transform: scale(1.015); }
    .capa button:focus-visible { outline: 2px solid var(--tinta); outline-offset: -6px; }

    /* ---------- Tela 2: convite ---------- */
    .convite {
      padding: 0 0 48px;
      text-align: center;
      animation: abrir 0.8s ease both;
    }
    @keyframes abrir {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: none; }
    }
    .foto {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 996 / 378;
      object-fit: cover;
      border-radius: 999px;
    }
    .nome {
      font-weight: 400;
      font-size: clamp(1.9rem, 8vw, 3.2rem);
      white-space: nowrap;
      letter-spacing: 0.14em;
      line-height: 1.1;
      margin-left: 0.14em; /* compensa o tracking para centralizar */
    }
    .nomes { margin-top: 56px; }
    .e-comercial {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 56px;
      margin: 18px 0 22px;
      font-family: var(--script);
      font-size: 2.4rem;
      color: var(--tinta-suave);
    }
    .e-comercial::before,
    .e-comercial::after {
      content: "";
      width: 46px;
      height: 1px;
      background: var(--linha);
    }
    .chamada {
      margin: 34px auto 0;
      max-width: 22em;
      padding: 0 24px;
      font-family: var(--italico);
      font-style: italic;
      font-weight: 700;
      font-size: 0.95rem;
      letter-spacing: 0.18em;
      line-height: 1.7;
    }
    .data {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 14px;
      max-width: 400px;
      margin: 40px auto 0;
      padding: 0 24px;
    }
    .data .lado {
      border-top: 1px solid var(--linha);
      border-bottom: 1px solid var(--linha);
      padding: 13px 0;
      font-size: 0.85rem;
      letter-spacing: 0.3em;
    }
    .data .dia {
      font-size: 4rem;
      line-height: 1;
      letter-spacing: 0.04em;
    }
    .ano {
      margin-top: 18px;
      font-size: 0.9rem;
      letter-spacing: 0.3em;
    }
    .hora {
      margin-top: 72px;
      font-size: 1.05rem;
      letter-spacing: 0.3em;
    }
    .local {
      margin-top: 30px;
      font-size: 0.85rem;
      letter-spacing: 0.32em;
      color: var(--tinta-suave);
    }

    .botoes {
      list-style: none;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4px;
      max-width: 460px;
      margin: 96px auto 0;
      padding: 0 12px;
    }
    .botao {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-decoration: none;
      color: var(--tinta);
      border-radius: 16px;
      -webkit-tap-highlight-color: transparent;
    }
    .botao svg { width: 100%; max-width: 160px; height: auto; overflow: visible; }
    .botao .circulo { fill: var(--azul); transition: fill 0.25s ease, transform 0.25s ease; transform-origin: 75px 52px; }
    .botao .icone { stroke: var(--creme-icone); fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
    .botao text {
      font-family: var(--italico);
      font-size: 10.5px;
      letter-spacing: 1.2px;
      fill: var(--tinta);
      text-transform: uppercase;
    }
    .botao:hover .circulo,
    .botao:focus-visible .circulo { fill: var(--azul-forte); transform: scale(1.05); }
    .botao:focus-visible { outline: 2px solid var(--azul-forte); outline-offset: 4px; }
    .botao[aria-disabled="true"] { cursor: default; opacity: 0.55; }
    .botao[aria-disabled="true"]:hover .circulo { fill: var(--azul); transform: none; }
    .em-breve {
      margin-top: 4px;
      font-size: 0.68rem;
      letter-spacing: 0.2em;
      color: var(--tinta-suave);
    }

    .dica {
      margin-top: 44px;
      font-size: 0.85rem;
      letter-spacing: 0.32em;
      line-height: 1.6;
      color: var(--tinta-suave);
    }
    .voltar {
      margin-top: 40px;
      border: 0;
      background: none;
      font: inherit;
      font-size: 0.75rem;
      letter-spacing: 0.25em;
      color: var(--tinta-suave);
      text-decoration: underline;
      text-underline-offset: 4px;
      cursor: pointer;
    }

    @media (max-width: 360px) {
      .data { gap: 8px; padding: 0 16px; }
      .data .dia { font-size: 3.3rem; }
      .data .lado { letter-spacing: 0.2em; font-size: 0.78rem; }
    }
    @media (prefers-reduced-motion: reduce) {
      .convite { animation: none; }
      .capa img, .botao .circulo { transition: none; }
    }
  </style>
</head>
<body>
  <main class="folha">
    <!-- Tela 1: capa (clique para abrir o convite) -->
    <section class="capa" id="capa">
      <button type="button" id="abrir" aria-label="Abrir o convite de casamento de Débora e João Ricardo">
        <img src="img/capa.jpg" width="996" height="1046"
             alt="Débora e João Ricardo em uma moldura oval ornamentada, 27.05.2027. Clique na imagem." />
      </button>
    </section>

    <!-- Tela 2: convite -->
    <section class="convite" id="convite" hidden aria-labelledby="titulo">
      <img class="foto" src="img/casal-eu-amo.jpg" width="996" height="378"
           alt="Débora e João Ricardo dentro do coração do letreiro “Eu amo”." />

      <h1 class="nomes" id="titulo">
        <span class="nome" style="display:block">DÉBORA</span>
        <span class="e-comercial" aria-label="e">&amp;</span>
        <span class="nome" style="display:block">JOÃO RICARDO</span>
      </h1>

      <p class="chamada">Convidam você para celebrar seu casamento</p>

      <p class="data" aria-label="Quinta-feira, 27 de maio de 2027">
        <span class="lado" aria-hidden="true">QUINTA</span>
        <span class="dia" aria-hidden="true">27</span>
        <span class="lado" aria-hidden="true">MAIO</span>
      </p>
      <p class="ano" aria-hidden="true">2027</p>

      <p class="hora">ÀS 10H30</p>
      <p class="local">COM FÉ EM INDAIATUBA</p>

      <ul class="botoes">
        <li>
          <a class="botao" id="link-local" target="_blank" rel="noopener">
            <svg viewBox="0 0 150 118" aria-hidden="true">
              <defs><path id="arco1" d="M 8 56 A 67 67 0 0 0 142 56" /></defs>
              <circle class="circulo" cx="75" cy="52" r="40" />
              <g class="icone">
                <path d="M75 72 C 66 60 62 54 62 47 a13 13 0 0 1 26 0 c0 7 -4 13 -13 25 z" />
                <circle cx="75" cy="47" r="4.5" />
              </g>
              <text><textPath href="#arco1" startOffset="50%" text-anchor="middle">Localização da festa</textPath></text>
            </svg>
            <span class="sr-only" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Localização da festa</span>
          </a>
        </li>
        <li>
          <a class="botao" id="link-presenca" target="_blank" rel="noopener">
            <svg viewBox="0 0 150 118" aria-hidden="true">
              <defs><path id="arco2" d="M 8 56 A 67 67 0 0 0 142 56" /></defs>
              <circle class="circulo" cx="75" cy="52" r="40" />
              <g class="icone">
                <rect x="58" y="37" width="34" height="31" rx="4" />
                <path d="M58 45 h34 M66 33 v7 M84 33 v7 M67 56 l5 5 l10 -10" />
              </g>
              <text><textPath href="#arco2" startOffset="50%" text-anchor="middle">Confirmar presença</textPath></text>
            </svg>
            <span style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Confirmar presença</span>
          </a>
        </li>
        <li>
          <a class="botao" id="link-presentes" target="_blank" rel="noopener">
            <svg viewBox="0 0 150 118" aria-hidden="true">
              <defs><path id="arco3" d="M 8 56 A 67 67 0 0 0 142 56" /></defs>
              <circle class="circulo" cx="75" cy="52" r="40" />
              <g class="icone">
                <rect x="59" y="47" width="32" height="22" rx="1.5" />
                <rect x="56" y="40" width="38" height="8" rx="1.5" />
                <path d="M75 40 v29 M75 40 c-4 -8 -14 -8 -12 -2 c1 2 6 2 12 2 c6 0 11 0 12 -2 c2 -6 -8 -6 -12 2" />
              </g>
              <text><textPath href="#arco3" startOffset="50%" text-anchor="middle">Lista de presentes</textPath></text>
            </svg>
            <span style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Lista de presentes</span>
          </a>
        </li>
      </ul>

      <p class="dica">CLIQUE NOS ÍCONES<br />PARA ACESSAR</p>

      <button type="button" class="voltar" id="voltar">VER A CAPA</button>
    </section>
  </main>

  <script>
    // ===== Links do convite — edite aqui =====
    // Deixe uma string vazia ("") para o botão aparecer como "em breve".
    const LINKS = {
      // Troque pelo link do Google Maps do local exato da festa.
      local: "https://www.google.com/maps/search/?api=1&query=Indaiatuba%2C+SP",
      presenca: "https://forms.gle/vLYCWM1vcNTxhG8U7",
      // Cole aqui o link da lista de presentes.
      presentes: "",
    };

    for (const [chave, url] of Object.entries(LINKS)) {
      const a = document.getElementById("link-" + chave);
      if (url) {
        a.href = url;
      } else {
        a.setAttribute("aria-disabled", "true");
        a.setAttribute("tabindex", "-1");
        const aviso = document.createElement("span");
        aviso.className = "em-breve";
        aviso.textContent = "EM BREVE";
        a.appendChild(aviso);
        a.addEventListener("click", (e) => e.preventDefault());
      }
    }

    const capa = document.getElementById("capa");
    const convite = document.getElementById("convite");

    function mostrar() {
      const aberto = location.hash === "#convite";
      capa.hidden = aberto;
      convite.hidden = !aberto;
      window.scrollTo(0, 0);
      if (aberto) document.getElementById("titulo").focus({ preventScroll: true });
    }
    document.getElementById("titulo").setAttribute("tabindex", "-1");
    document.getElementById("abrir").addEventListener("click", () => { location.hash = "convite"; });
    document.getElementById("voltar").addEventListener("click", () => { history.pushState(null, "", location.pathname); mostrar(); });
    window.addEventListener("hashchange", mostrar);
    window.addEventListener("popstate", mostrar);
    mostrar();
  </script>
</body>
</html>
